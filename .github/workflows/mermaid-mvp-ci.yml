name: Mermaid MVP CI

on:
  push:
    branches:
      - feat/mermaid-mvp-autoflasher
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install host toolchain
        run: python -m pip install -r requirements-mvp.txt

      - name: Install release Flipper SDK
        run: |
          export UFBT_HOME="$GITHUB_WORKSPACE/.ufbt"
          ufbt update --channel=release

      - name: Validate host policy and ESP firmware
        run: |
          export UFBT_HOME="$GITHUB_WORKSPACE/.ufbt"
          node scripts/validate.mjs

      - name: Build Flipper FAP
        working-directory: flipper/mermaid_mvp
        run: |
          export UFBT_HOME="$GITHUB_WORKSPACE/.ufbt"
          ufbt
