name: CYD Android Codex

on:
  push:
    branches:
      - feat/cyd-android-codex-cli-automation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cyd-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO and esptool
        run: python -m pip install "platformio==6.2.0" "esptool==4.12.0" "pyserial==3.5"
      - name: Shell syntax
        run: |
          bash -n android/termux/bootstrap.sh
          bash -n android/termux/cyd-build-export.sh
          bash -n android/termux/cyd-codex.sh
          bash -n android/termux/open-cyd-flasher.sh
      - name: Build CYD
        run: pio run -d firmware/e32r28t
      - name: Validate expected identity
        run: grep -F "MERMAID_HELLO role=CYD hw=ESP32-WROOM-32E-N4 proto=MVP1" firmware/e32r28t/src/main.cpp
