name: CYD Android Codex

on:
  push:
    branches:
      - feat/cyd-android-codex-cli-automation
    paths-ignore:
      - "firmware/releases/cyd/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-cyd-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cyd-android-codex-cli-automation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and esptool
        run: python -m pip install "platformio==6.2.0" "esptool==4.12.0" "pyserial==3.5"

      - name: Shell syntax
        run: |
          bash -n android/termux/bootstrap.sh
          bash -n android/termux/cyd-build-export.sh
          bash -n android/termux/cyd-codex.sh
          bash -n android/termux/open-cyd-flasher.sh
          bash -n android/termux/cyd-flash-termux.sh
          bash -n android/termux/start-cyd-nr-flasher.sh
          python -m py_compile android/termux/cyd-nr-server.py

      - name: Build merged CYD factory image
        env:
          MERMAID_CI_OUTDIR: ${{ github.workspace }}/dist/cyd-android
        run: bash android/termux/cyd-build-export.sh

      - name: Validate expected identity
        run: grep -F "MERMAID_HELLO role=CYD hw=ESP32-WROOM-32E-N4 proto=MVP1" firmware/e32r28t/src/main.cpp

      - name: Commit firmware binary and manifest to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/cyd-android-codex-cli-automation'
        run: |
          set -euo pipefail
          mkdir -p firmware/releases/cyd
          cp dist/cyd-android/cyd-wroom32e-n4-mermaid.factory.bin firmware/releases/cyd/mermaid-cyd.factory.bin
          cp dist/cyd-android/cyd-wroom32e-n4-mermaid.manifest.txt firmware/releases/cyd/mermaid-cyd.manifest.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/releases/cyd/mermaid-cyd.factory.bin firmware/releases/cyd/mermaid-cyd.manifest.txt

          if git diff --cached --quiet; then
            echo "Repository firmware is already current."
          else
            git commit -m "build: publish Mermaid CYD firmware"
            git push origin HEAD:feat/cyd-android-codex-cli-automation
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyd-wroom32e-n4-mermaid
          path: |
            dist/cyd-android/cyd-wroom32e-n4-mermaid.factory.bin
            dist/cyd-android/cyd-wroom32e-n4-mermaid.manifest.txt
          if-no-files-found: error

      - name: Publish Android download release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/cyd-android-codex-cli-automation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cyd-android-latest --cleanup-tag -y || true
          gh release create cyd-android-latest \
            dist/cyd-android/cyd-wroom32e-n4-mermaid.factory.bin \
            dist/cyd-android/cyd-wroom32e-n4-mermaid.manifest.txt \
            --target "$GITHUB_SHA" \
            --title "CYD Android Latest" \
            --notes "Automated 4 MB merged factory image for the 918 MERMAID CYD / ESP32-WROOM-32E-N4 native NR and GitHub flasher paths." \
            --prerelease
