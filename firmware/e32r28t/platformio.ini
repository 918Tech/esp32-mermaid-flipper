[env:e32r28t]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  bblanchon/ArduinoJson @ ^7.4.2
build_flags =
  -DUSER_SETUP_LOADED=1
  -include User_Setup.h
  -DCORE_DEBUG_LEVEL=3
